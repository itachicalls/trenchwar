<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
}
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
#status, #status-splash { top: 0; bottom: 0; }
#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash { max-height: 100%; max-width: 100%; margin: auto; }
#status-progress, #status-notice { display: none; }
#status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: system-ui, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
	</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">HTML5 canvas required.</canvas>
	<noscript>JavaScript required.</noscript>
	<div id="status">
		<img id="status-splash" src="$GODOT_SPLASH" alt="">
		<progress id="status-progress"></progress>
		<div id="status-notice"></div>
	</div>
	<script src="solana_bridge.js"></script>
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') { statusOverlay.remove(); initializing = false; return; }
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}
	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : String(err));
		setStatusMode('notice');
		initializing = false;
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('Missing:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => setStatusMode('hidden'), displayFailureNotice);
	}
})();
	</script>
</body>
</html>
